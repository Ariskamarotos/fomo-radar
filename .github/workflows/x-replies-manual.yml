name: Test X Influencer Replies (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: x-replies-manual
  cancel-in-progress: false
jobs:
  test-x-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch latest X posts and detect replies (billable)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/x_replies.py
      - name: Save public reply signal snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/x_signals.json data/x_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update X influencer reply signals (manual test)'
            git push
          fi
