name: Update FOMO Trending
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fomo-trending-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and sanitize FOMO board
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python scripts/update.py
      - name: Test DEX enrichment (offline mocked API)
        run: python -m unittest discover -s tests -v
      - name: Enrich tokens with DEX liquidity and 5m/1h data
        continue-on-error: true
        run: python scripts/enrich_dex.py
      - name: Detect rapid dumps and liquidity collapses
        run: python scripts/detect_dumps.py
      - name: Commit updated public JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trending.json
          if [ -f data/graduated.json ]; then git add data/graduated.json; fi
          if [ -f data/dex_risk_state.json ]; then git add data/dex_risk_state.json; fi
          if [ -f data/dex_enrichment.json ]; then git add data/dex_enrichment.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update FOMO trending and DEX enrichment snapshots'
            git push
          fi
