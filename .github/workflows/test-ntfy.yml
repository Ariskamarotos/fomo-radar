name: Test ntfy iPhone Push (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send one test notification (no X API calls)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Missing NTFY_TOPIC repository secret"
            exit 1
          fi
          if ! [[ "$NTFY_TOPIC" =~ ^[A-Za-z0-9_-]{24,}$ ]]; then
            echo "::error::Invalid NTFY_TOPIC format"
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 \
            -H "Title: FOMO Radar test" \
            -H "Priority: 4" \
            -H "Tags: white_check_mark" \
            -d "Test push from GitHub FOMO Radar. No token alert; no X API credits used." \
            "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          echo "Test push submitted to ntfy"
