name: Scheduler heartbeat (no API cost)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Report schedule trigger without external API calls
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Run ID: $RUN_ID"
          date -u '+UTC heartbeat: %Y-%m-%dT%H:%M:%SZ'
          echo "No X API calls. No push notifications. No repository writes."
